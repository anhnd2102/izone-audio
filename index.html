<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IZONE – Audio Exam</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.png">
</head>
<body>
  <div class="card index-card">

    <div class="card-header">
      <div class="header-logo" id="headerLogo">
        <img src="assets/img/logo.png" alt="IZONE"
          onerror="document.getElementById('headerLogo').classList.add('failed')">
        <span class="logo-text-fallback">IZONE</span>
      </div>
      <div class="header-divider"></div>
      <div class="header-info">
        <div class="header-tagline">IELTS Chiến Lược</div>
        <div class="header-test-name" id="headerTitle">Dành cho giáo viên</div>
      </div>
    </div>

    <div class="card-body">

      <!-- ── Password Gate ── -->
      <div id="gateSection" class="gate-section">
        <p class="gate-desc">
          Trang này chỉ dành cho <strong style="color:var(--navy)">giáo viên</strong>.<br>
          Vui lòng nhập mật khẩu để xem danh sách bài thi.
        </p>
        <div class="gate-field">
          <label for="gateInput">Mật khẩu giáo viên</label>
          <div class="gate-input-wrap">
            <input id="gateInput" class="gate-input" type="password"
              placeholder="Nhập mật khẩu..." autocomplete="off"
              onkeydown="if(event.key==='Enter') submitGate()">
            <button class="gate-eye" id="eyeBtn" onclick="toggleEye()" title="Hiện/ẩn mật khẩu">👁</button>
          </div>
          <div class="gate-error" id="gateError"></div>
        </div>
        <button class="btn btn-play" onclick="submitGate()">Đăng nhập</button>
      </div>

      <!-- ── Test List (hidden until authenticated) ── -->
      <div id="listSection" style="display:none; flex-direction:column; gap:14px;">
        <p class="index-intro">
          Chọn bài thi theo hướng dẫn của giáo viên.<br>
          Mỗi bài chỉ nghe được <strong style="color:var(--navy)">1 lần</strong> trên mỗi trình duyệt/thiết bị.
        </p>
        <div class="test-list" id="testList"></div>
        <button class="btn btn-outline btn-sm" onclick="logout()" style="margin-top:4px;">
          Đăng xuất
        </button>
      </div>

    </div>

    <div class="card-footer">IZONE &nbsp;·&nbsp; IELTS CHIẾN LƯỢC</div>
  </div>

  <script>
    // ── Đổi mật khẩu tại đây ──────────────────────────────
    const GV_PASSWORD = 'izone2026';
    // ─────────────────────────────────────────────────────

    const TESTS = [
      { id: 'test-1', name: 'Test 1 Phase 1', href: '1xjm77.html' },
      { id: 'test-2', name: 'Test 2 Phase 1', href: '666w9y.html' },
      { id: 'test-3', name: 'Test 3 Phase 1', href: 'v527aj.html' },
      { id: 'test-4', name: 'Test 4 Phase 1', href: 'y6d5mf.html' },
      { id: 'test-5', name: 'Test 1 Phase 2', href: 'pmw99z.html' },
      { id: 'test-6', name: 'Test 2 Phase 2', href: 'oz0zih.html' },
    ];

    function isAuthed() {
      return sessionStorage.getItem('izone_gv_auth') === '1';
    }

    function showList() {
      document.getElementById('gateSection').style.display = 'none';
      const ls = document.getElementById('listSection');
      ls.style.display = 'flex';
      document.getElementById('headerTitle').textContent = 'Danh sách bài thi';
      renderTests();
    }

    function renderTests() {
      const list = document.getElementById('testList');
      if (list.children.length > 0) return; // already rendered
      TESTS.forEach(function (t, i) {
        const played = localStorage.getItem('izone_played_' + t.id) === '1';
        const badge  = played
          ? '<span class="badge badge-done">✓ Đã nghe</span>'
          : '<span class="badge badge-pending">Chưa nghe</span>';

        const item = document.createElement('a');
        item.href = t.href;
        item.className = 'test-item';
        item.innerHTML = `
          <div class="test-item-left">
            <div class="test-num">${i + 1}</div>
            <div>
              <div class="test-name">${t.name}</div>
              <div class="test-sub">IELTS Listening &nbsp;·&nbsp; 18:45 – 19:05</div>
            </div>
          </div>
          <div class="test-right">
            ${badge}
            <span class="arrow">›</span>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function submitGate() {
      const input = document.getElementById('gateInput');
      const errEl = document.getElementById('gateError');

      input.classList.remove('error');
      errEl.textContent = '';

      if (input.value === GV_PASSWORD) {
        sessionStorage.setItem('izone_gv_auth', '1');
        showList();
      } else {
        input.classList.add('error');
        errEl.textContent = 'Mật khẩu không đúng. Vui lòng thử lại.';
        input.value = '';
        input.focus();
      }
    }

    function logout() {
      sessionStorage.removeItem('izone_gv_auth');
      location.reload();
    }

    function toggleEye() {
      const input = document.getElementById('gateInput');
      const btn   = document.getElementById('eyeBtn');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    }

    // ── Init ────────────────────────────────────────────
    if (isAuthed()) {
      showList();
    } else {
      document.getElementById('gateInput').focus();
    }
  </script>
</body>
</html>
